version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: code-execution-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-execution-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - code_runner_1
      - code_runner_2
      - code_runner_3
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      PYTHONPATH: /app
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: code-execution-worker
    command: ["python", "app/worker/worker.py"]
    depends_on:
      - redis
      - code_runner_1
      - code_runner_2
      - code_runner_3
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      PYTHONPATH: /app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Container Pool - Persistent execution environments
  code_runner_1:
    image: python:3.11-slim
    container_name: code_runner_1
    command: tail -f /dev/null
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    memory: 256m
    cpus: "0.5"

  code_runner_2:
    image: python:3.11-slim
    container_name: code_runner_2
    command: tail -f /dev/null
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    memory: 256m
    cpus: "0.5"

  code_runner_3:
    image: python:3.11-slim
    container_name: code_runner_3
    command: tail -f /dev/null
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    memory: 256m
    cpus: "0.5"
